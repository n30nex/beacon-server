name: Build and Publish Docker Image

on:
  push:
    branches: [main, dev]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: beacon
          POSTGRES_PASSWORD: beacon
          POSTGRES_DB: beacon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beacon -d beacon_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      BEACON_TEST_DATABASE_URL: postgres://beacon:beacon@127.0.0.1:5432/beacon_test?sslmode=disable

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          check-latest: true
          cache: true

      - name: Build, format, vet, and test
        shell: bash
        run: |
          go build ./...
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

      - name: Validate production operations bundle
        run: bash ops/production/tests/validate-production.sh

      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Record immutable build provenance
        id: provenance
        shell: bash
        run: echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build candidate image locally
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .build/Dockerfile
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:candidate-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.provenance.outputs.build_time }}
            BUILD_DIRTY=false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan candidate image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:candidate-${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the scanned image
        id: publish
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -Eeuo pipefail
          candidate="${REGISTRY}/${IMAGE_NAME}:candidate-${GITHUB_SHA}"
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            docker tag "$candidate" "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
          ref="$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$candidate" | grep -m1 "^${REGISTRY}/${IMAGE_NAME}@sha256:")"
          [[ -n "$ref" ]] || { echo "Published image digest was not recorded" >&2; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$ref" | tee beacon-server-image.txt
          printf '### Beacon server image\n\n`%s`\n' "$ref" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable image reference
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beacon-server-image-${{ github.sha }}
          path: beacon-server-image.txt
          if-no-files-found: error
