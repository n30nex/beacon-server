  github_com_MeshCore-Beacon_beacon-server_internal_api.AtlasReplayPage:
    properties:
      hasMore:
        type: boolean
      items:
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.AtlasReplayPacket'
        type: array
      nextCursor:
        type: integer
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.AtlasStoryBeat:
    properties:
      at:
        type: integer
      detail:
        type: string
      iata:
        type: string
      id:
        type: string
      kind:
        type: string
      title:
        type: string
      value:
        type: integer
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.AtlasWindow:
    properties:
      since:
        description: epoch ms
        type: integer
      until:
        description: epoch ms
        type: integer
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.Channel:
    properties:
      channelHash:
        description: hex-encoded single-byte hash
        type: string
      hashtag:
        description: 'tag name without # prefix; non-nil only for hashtag channels'
        type: string
      id:
        type: integer
      isHashtag:
        description: true if key was derived from a hashtag PSK
        type: boolean
      keyFingerprint:
        description: first 8 bytes of SHA256(key), hex-encoded
        type: string
      keyKnown:
        description: true if Beacon has a decryption key for this channel
        type: boolean
      lastSeen:
        description: epoch ms, time of most recent message
        type: integer
      messageCount:
        type: integer
      name:
        description: display name from config or nil
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.ChannelMessage:
    properties:
      channelHash:
        description: hex-encoded single-byte channel hash
        type: string
      content:
        description: decrypted message text
        type: string
      id:
        type: integer
      observationCount:
        description: number of packet_observations rows for this message's packet
          hash
        type: integer
      packetHash:
        description: hex-encoded packet hash for correlation with packet events
        type: string
      senderName:
        description: display name from the decrypted payload
        type: string
      sentAt:
        description: epoch ms, from the sender's embedded timestamp
        type: integer
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.ChannelSummary:
    properties:
      channelHash:
        description: hex-encoded single-byte hash
        type: string
      id:
        type: integer
      isHashtag:
        description: true if key was derived from a hashtag PSK
        type: boolean
      keyKnown:
        description: true if Beacon has a decryption key for this channel
        type: boolean
      lastSeen:
        description: epoch ms, time of most recent message
        type: integer
      name:
        description: display name from config or nil
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.ChannelSummaryPage:
    properties:
      hasMore:
        type: boolean
      items:
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.ChannelSummary'
        type: array
      nextCursor:
        type: integer
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.CrossIATAHop:
    properties:
      fromIata:
        type: string
      fromNode:
        allOf:
        - $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.ResolvedNode'
        description: last node in source IATA
      lastSeen:
        description: epoch ms
        type: integer
      toIata:
        type: string
      toNode:
        allOf:
        - $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.ResolvedNode'
        description: first node in target IATA
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.CrossIATARoute:
    properties:
      crossHop:
        allOf:
        - $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.CrossIATAHop'
        description: the boundary hop
      sourceSegment:
        description: route segment in source IATA
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.RouteHop'
        type: array
      targetSegment:
        description: route segment in target IATA
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.RouteHop'
        type: array
      totalHops:
        type: integer
    type: object
