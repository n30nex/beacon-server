      observationCount:
        type: integer
      payloadType:
        type: integer
      payloadTypeName:
        type: string
      rawHex:
        type: string
      routeType:
        type: integer
      routeTypeName:
        type: string
      scope:
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.LivePacketObservation:
    properties:
      observation:
        $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.LiveObservationEnvelope'
      packet:
        $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.LivePacketEnvelope'
      packetHash:
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.LiveRouteMixItem:
    properties:
      count:
        type: integer
      routeType:
        type: integer
      routeTypeName:
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.LiveSummary:
    properties:
      activeObservers:
        type: integer
      latestObservationId:
        type: integer
      observationCount:
        type: integer
      packetCount:
        type: integer
      payloadMix:
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.PayloadBreakdownItem'
        type: array
      routeMix:
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.LiveRouteMixItem'
        type: array
      serverTime:
