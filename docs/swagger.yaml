      id:
        type: string
      lastSeen:
        description: epoch ms
        type: integer
      lat:
        type: number
      lng:
        type: number
      name:
        type: string
      nodeType:
        type: integer
      nodeTypeName:
        type: string
      observationCount:
        type: integer
      publicKey:
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.NodeSummary:
