      observationCount:
        type: integer
      origin:
        $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.ResolvedNode'
      packetHash:
        type: string
      path:
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.AtlasPathPoint'
        type: array
      payloadType:
        type: integer
      payloadTypeName:
        type: string
      routeType:
        type: integer
      routeTypeName:
        type: string
      scope:
        type: string
