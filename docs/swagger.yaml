        type: string
      packetHash:
        description: hex-encoded
        type: string
      payloadType:
        type: integer
      payloadTypeName:
        type: string
      rssi:
        type: integer
      snr:
        type: number
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.AdvertObservationPage:
    properties:
      hasMore:
        type: boolean
      items:
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.AdvertObservation'
        type: array
      nextCursor:
        type: integer
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.AtlasIATA:
