      heardAt:
        type: integer
      iata:
        type: string
      id:
        type: integer
      observerId:
        type: string
      observerName:
        type: string
      pathBytes:
        type: string
      pathLength:
        $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.PacketPathLength'
      propagationTimeMs:
        type: integer
      resolvedPath:
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.ResolvedHop'
        type: array
      rssi:
        type: integer
      snr:
        type: number
      sourceBroker:
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.LivePacketEnvelope:
